[package]
name = "demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "A small extension module built with orochi, imported by real Python in run.ps1"

[lib]
crate-type = ["cdylib"]
# Only built as an extension module; `run.ps1` exercises it from Python.
test = false
doctest = false

[dependencies]
orochi = { path = "../.." }

[lints.rust]
# MSVC prints "Creating library ..." when linking a DLL; not a problem.
linker_messages = "allow"
